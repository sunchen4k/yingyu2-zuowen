<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语二 · 图表作文背诵卡</title>
<style>
:root{
  --bg:#f5f1e8;
  --bg-soft:#ece5d6;
  --surface:#fffdf8;
  --surface-2:#faf6ec;
  --ink:#27221a;
  --ink-2:#6c6354;
  --ink-3:#a89e8b;
  --line:#e5ddcc;
  --line-2:#f0eadb;
  --accent:#b5483c;
  --accent-soft:#f4e3de;
  --green:#3f826d;
  --green-soft:#e0ede7;
  --red:#b5483c;
  --red-soft:#f5e2dd;
  --gold:#a9783f;
  --shadow:0 1px 2px rgba(46,38,24,.04),0 10px 30px rgba(46,38,24,.06);
  --shadow-lg:0 2px 6px rgba(46,38,24,.06),0 24px 60px rgba(46,38,24,.10);
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  --r:16px;
}
[data-theme="dark"]{
  --bg:#16130d;
  --bg-soft:#1f1a12;
  --surface:#211c14;
  --surface-2:#282218;
  --ink:#ece4d4;
  --ink-2:#b3a78f;
  --ink-3:#7f7461;
  --line:#342c1e;
  --line-2:#2c2519;
  --accent:#d47768;
  --accent-soft:#3a2520;
  --green:#78b69c;
  --green-soft:#203029;
  --red:#d47768;
  --red-soft:#3a2520;
  --gold:#c79a55;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::selection{background:var(--accent);color:#fff}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:286px;flex:0 0 286px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 14px;gap:14px;overflow-y:auto;transition:transform .3s ease;z-index:40}
.brand{padding:6px 8px 4px}
.brand h1{font-family:var(--serif);font-size:23px;letter-spacing:2px;font-weight:700;line-height:1.25}
.brand h1 .seal{color:var(--accent)}
.brand p{font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:1px}
.search{position:relative}
.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.nav{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav-label{font-size:11px;color:var(--ink-3);letter-spacing:2px;padding:12px 10px 4px;font-weight:600}
.nav-item{border-radius:12px;transition:background .15s}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft)}
.nav-item.active .nav-name{color:var(--accent)}
.nav-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;width:100%;text-align:left}
.nav-row .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:var(--line-2);background:color-mix(in srgb,var(--cat,#8a7a5f) 16%,transparent);color:var(--cat,var(--ink-2))}
.nav-row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-name{flex:1;font-size:13px;font-weight:600;text-align:left}
.nav-count{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 10px 50px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);transition:all .15s;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.done{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
.side-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.side-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.side-stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn-reset{font-size:12px;color:var(--ink-3);padding:6px;border-radius:8px;transition:color .15s,background .15s}
.btn-reset:hover{color:var(--red);background:var(--red-soft)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:20px 28px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title-area h2{font-family:var(--serif);font-size:22px;letter-spacing:1px;font-weight:700}
.title-area p{font-size:13px;color:var(--ink-3);margin-top:3px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 12px;font-size:13px;font-weight:600;border-radius:8px;color:var(--ink-2);transition:all .18s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.select{padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:13px;outline:none;cursor:pointer;font-weight:500}
.select:focus{border-color:var(--accent)}
.icon-toggle{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:all .18s}
.icon-toggle:hover{border-color:var(--accent);color:var(--accent)}
.icon-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);place-items:center}
.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.progressbar{height:3px;background:var(--line);position:relative;margin:0 28px 4px;border-radius:99px;overflow:hidden}
.progressbar #pfill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.content{flex:1;overflow-y:auto;padding:14px 28px 60px}

/* Section header */
.section{margin-bottom:8px}
.section-head{display:flex;align-items:center;gap:12px;padding:18px 4px 12px}
.section-head .sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 36px}
.section-head .sq svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.section-head h3{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:1px}
.section-head .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.section-head .spacer{flex:1}
.section-head .done-badge{font-size:12px;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:99px;font-weight:600}

/* Grid & Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s,opacity .2s;scroll-margin-top:16px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat,#c9b99a);opacity:.9}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.card.mastered{opacity:.84}
.card.mastered::after{content:"已掌握";position:absolute;top:12px;right:-34px;background:var(--green);color:#fff;font-size:11px;padding:4px 36px;transform:rotate(40deg);letter-spacing:1px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-title{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.card-title h3{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.3}
.card-title h3.en{font-family:"Georgia","Times New Roman",serif;font-size:20px}
.cat-chip{font-size:11px;color:var(--cat,#8a7a5f);background:var(--line-2);background:color-mix(in srgb,var(--cat,#8a7a5f) 12%,transparent);padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.card-actions{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:var(--ink-3);transition:all .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.fav-on{color:var(--gold)}
.icon-btn.master-on{color:var(--green)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvl{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:1px;white-space:nowrap}
.lvl0{color:var(--ink-3);background:var(--line-2)}
.lvl1{color:var(--red);background:var(--red-soft)}
.lvl2{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.lvl3{color:var(--green);background:var(--green-soft)}
.lvl4{color:#fff;background:var(--green)}
.meta{font-size:13px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tagchip{font-size:11px;padding:2px 9px;border-radius:6px;background:var(--line-2);color:var(--ink-2);font-weight:600}

/* Blocks */
.blk{position:relative;margin:10px 0;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line-2)}
.blk .btag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:6px;margin-bottom:6px}
.blk.en .btag{color:var(--accent);background:var(--accent-soft)}
.blk.ex .btag{color:var(--green);background:var(--green-soft)}
.blk.note .btag{color:var(--ink-2);background:var(--line-2)}
.btext{font-family:var(--serif);font-size:15px;line-height:1.85;color:var(--ink);text-align:justify;white-space:pre-wrap;word-break:break-word}
.blk.en .btext,.blk.ex .btext{font-family:"Georgia","Times New Roman",var(--serif)}
.blk.note .btext{font-family:var(--sans);font-size:13px;line-height:1.75;color:var(--ink-2)}
.para-note{width:100%;font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--ink);background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;outline:none;resize:vertical;min-height:38px;margin-top:4px;transition:border .2s}
.para-note:focus{border-color:var(--accent)}
.para-note::placeholder{color:var(--ink-3);font-style:italic}

/* blur / reveal */
.blk[data-bt]{cursor:pointer}
.blk.blurred .btext{filter:blur(7px);user-select:none;pointer-events:none}
.reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:6px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:1px;backdrop-filter:blur(2px)}
.blk.blurred .reveal{display:flex}
.reveal:hover{color:var(--accent)}

/* Flashcard */
.flash-wrap{max-width:720px;margin:0 auto;padding:10px 0 40px}
.flash-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.flash-controls .pos{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.flash{perspective:1400px;cursor:pointer}
.flash-inner{position:relative;width:100%;min-height:420px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:34px 32px;display:flex;flex-direction:column}
.flash-back{transform:rotateY(180deg);overflow-y:auto}
.flash-cat{align-self:flex-start;font-size:12px;font-weight:600;color:var(--cat);background:var(--line-2);background:color-mix(in srgb,var(--cat) 12%,transparent);padding:4px 12px;border-radius:99px;margin-bottom:18px}
.flash-word{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:1px;text-align:center;margin:10px 0 6px;line-height:1.4}
.flash-word.en{font-family:"Georgia","Times New Roman",serif;font-size:36px}
.flash-hint{margin-top:auto;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:2px}
.flash-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:11px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost-green{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
.btn.ghost-green:hover{border-color:var(--green)}

/* Quiz / Review */
.quiz-wrap,.review-wrap{max-width:720px;margin:0 auto;padding:10px 0 40px}
.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 30px 26px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.quiz-word{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:1px;line-height:1.35}
.quiz-word.en{font-family:"Georgia","Times New Roman",serif;font-size:30px}
.quiz-cat{font-size:12px;color:var(--ink-3);margin-top:2px}
.quiz-prompt{font-size:12px;color:var(--ink-3);letter-spacing:2px;font-weight:600;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:14px}
.quiz-answer{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-height:110px;display:flex;flex-direction:column;gap:6px;justify-content:center;padding:14px}
.quiz-answer .btext{filter:blur(8px);user-select:none}
.quiz-answer.revealed .btext{filter:none}
.quiz-answer.revealed .blur-hint{display:none}
.blur-hint{font-size:13px;color:var(--ink-3);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.quiz-actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.quiz-stats{display:flex;justify-content:center;gap:20px;margin-top:18px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.quiz-stats b{color:var(--green);font-variant-numeric:tabular-nums}
.review-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat-tile{flex:1;min-width:90px;text-align:center}
.stat-tile .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.stat-tile .l{font-size:11px;color:var(--ink-3);letter-spacing:1px;margin-top:2px}
.stat-tile .n.g{color:var(--green)}.stat-tile .n.r{color:var(--accent)}.stat-tile .n.a{color:var(--gold)}
.review-head .head-ctrl{display:flex;align-items:center;gap:8px}

/* Modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.show{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);max-width:580px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);font-size:16px}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:16px;letter-spacing:1px}
.share-sec{padding:14px 0;border-top:1px solid var(--line)}
.share-sec:first-of-type{border-top:none;padding-top:0}
.share-sec h4{font-size:14px;font-weight:700;margin-bottom:6px}
.share-sec p{font-size:13px;color:var(--ink-2);line-height:1.75;margin-bottom:10px}
.share-sec p b{color:var(--ink)}
.rm-word{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:1px;text-align:center;margin:14px 0 4px;line-height:1.4}
.rm-word.en{font-family:"Georgia","Times New Roman",serif}
.rm-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}

/* Empty */
.empty{max-width:480px;margin:60px auto;text-align:center;color:var(--ink-3)}
.empty .big{font-size:44px;margin-bottom:14px}
.empty h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.7;margin-bottom:16px}
.empty .btn{margin:4px}

/* Toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:100;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Overlay (mobile) */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;opacity:0;transition:opacity .3s}
.overlay.show{display:block;opacity:1}

@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .topbar{padding:16px 16px 10px}
  .content{padding:10px 16px 60px}
  .progressbar{margin:0 16px 2px}
  .grid{grid-template-columns:1fr}
  .title-area h2{font-size:19px}
  .flash-word{font-size:26px}
  .quiz-word{font-size:22px}
  .modal-card{padding:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>英语二<span class="seal">·</span>图表作文</h1>
      <p>大作文模板 · 词库背诵卡</p>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索单词 / 关键词…">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-stat"><span>已掌握</span><b id="statMastered">0 / 92</b></div>
      <div class="side-stat"><span>已收藏</span><b id="statFavs">0</b></div>
      <div class="side-stat"><span>今日已复习</span><b id="statToday">0 条</b></div>
      <button class="btn-reset" id="btnReset">清除全部学习进度</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn" aria-label="菜单">
          <svg viewBox="0 0 24 24"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
        </button>
        <div class="title-area">
          <h2 id="viewTitle">词库总览</h2>
          <p id="viewSub">图表作文模板 + 图表描述词汇 · 92 条</p>
        </div>
      </div>

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function allItems(){ const r=[]; DATA.forEach(c=>c.items.forEach(it=>r.push(Object.assign({},it,{category:c})))); return r; }
function findItem(id){ return allItems().find(w=>w.id===id); }
function isEnWord(title){ return /^[A-Za-z]/.test(title); }

/* ================= 常量 ================= */
const LS = 'yingyu2_v1';
const INTERVALS = {1:1, 2:3, 3:7, 4:14};
const LEVELS = ['新学','生疏','一般','熟练','已掌握'];
const TOTAL = allItems().length;

/* ================= 状态 ================= */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let state = {
  theme: localStorage.getItem(LS+'_theme') || 'light',
  view: 'browse', catId: 'all', q: '', blur: 'none',
  srs: {}, favs: new Set(), notes: {},
  dailyNew: parseInt(localStorage.getItem(LS+'_dailyNew')||'5',10),
  daily: JSON.parse(localStorage.getItem(LS+'_daily')||'{"date":"","done":0}'),
  flashFilter: 'all', flashIndex: 0, flashFlipped: false,
  quizFilter: 'unmastered', quizDeck: [], quizIndex: 0, quizRevealed: false,
  session: {reviewed:0, mastered:0},
  reviewQueue: [], reviewIndex: 0, reviewRevealed: false, reviewStats: {ok:0,no:0},
  randomId: null, randomRevealed: false
};
(function loadState(){
  state.srs = JSON.parse(localStorage.getItem(LS+'_srs')||'{}');
  state.favs = new Set(JSON.parse(localStorage.getItem(LS+'_favs')||'[]'));
  state.notes = JSON.parse(localStorage.getItem(LS+'_notes')||'{}');
  if(state.daily.date !== todayStr()) state.daily = {date:todayStr(), done:0};
})();
function persistSrs(){ localStorage.setItem(LS+'_srs', JSON.stringify(state.srs)); }
function persistFavs(){ localStorage.setItem(LS+'_favs', JSON.stringify([...state.favs])); }
function persistNotes(){ localStorage.setItem(LS+'_notes', JSON.stringify(state.notes)); }

function getSrs(id){ return state.srs[id] || {lvl:0, due:''}; }
function isMastered(id){ return (state.srs[id]?.lvl ?? 0) >= 4; }
function masteredCount(){ return allItems().filter(w=>isMastered(w.id)).length; }
function levelOf(id){ return Math.min(4, state.srs[id]?.lvl ?? 0); }

function srsAnswer(id, correct){
  const cur = getSrs(id);
  if(correct){
    const lvl = Math.min(4, cur.lvl + 1);
    state.srs[id] = { lvl, due: addDays(INTERVALS[lvl] || 14) };
  } else {
    const lvl = Math.max(0, cur.lvl - 1);
    state.srs[id] = { lvl, due: lvl > 0 ? todayStr() : '' };
  }
  persistSrs(); bumpDaily();
}
function bumpDaily(){
  if(state.daily.date !== todayStr()) state.daily = {date:todayStr(), done:0};
  state.daily.done++;
  localStorage.setItem(LS+'_daily', JSON.stringify(state.daily));
  $('#statToday').textContent = state.daily.done + ' 条';
}

/* ================= 渲染 ================= */
const content = $('#content');
function renderContent(){
  if(state.view==='review') return renderReview();
  if(state.view==='flash') return renderFlash();
  if(state.view==='quiz') return renderQuiz();
  renderBrowse();
}

function blockHTML(b){
  if(b.k==='note') return `<div class="blk note"><span class="btag">${b.label}</span><p class="btext">${esc(b.text)}</p></div>`;
  const cls = b.k==='ex' ? 'ex' : 'en';
  return `<div class="blk ${cls}" data-bt="${b.k}"><span class="btag">${b.label}</span><p class="btext">${esc(b.text)}</p><button class="reveal">👁 点击显示</button></div>`;
}

function cardHTML(it){
  const cat = it.category;
  const lvl = levelOf(it.id);
  const m = lvl >= 4;
  const f = state.favs.has(it.id);
  const titleCls = isEnWord(it.title) ? 'en' : '';
  return `<article class="card ${m?'mastered':''}" id="card-${it.id}" data-id="${it.id}" style="--cat:${cat.color}">
    <div class="card-head">
      <div class="card-title">
        <h3 class="${titleCls}">${esc(it.title)}</h3>
        <span class="cat-chip">${cat.name}</span>
        <span class="lvl lvl${lvl}">${LEVELS[lvl]}</span>
      </div>
      <div class="card-actions">
        <button class="icon-btn ${f?'fav-on':''}" data-act="fav" data-id="${it.id}" title="收藏">★</button>
        <button class="icon-btn ${m?'master-on':''}" data-act="master" data-id="${it.id}" title="标记掌握">${m?'✓':'○'}</button>
        <button class="icon-btn" data-act="copy" data-id="${it.id}" title="复制">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
    ${it.meta?`<div class="meta">${esc(it.meta)}</div>`:''}
    ${it.tags && it.tags.length?`<div class="tags">${it.tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div>`:''}
    ${it.blocks.map(blockHTML).join('')}
    <textarea class="para-note" data-note="${it.id}" placeholder="✎ 我的笔记（记忆点 / 替换词，自动保存）">${esc(state.notes[it.id]||'')}</textarea>
  </article>`;
}

function sectionHeader(cat){
  const done = cat.items.filter(w=>isMastered(w.id)).length;
  return `<div class="section">
    <div class="section-head">
      <div class="sq" style="background:${cat.color}"><svg viewBox="0 0 24 24">${cat.icon}</svg></div>
      <div><h3>${cat.name}</h3><div class="sub">${cat.full} · ${cat.items.length} 条</div></div>
      <div class="spacer"></div>
      ${done===cat.items.length?`<span class="done-badge">已全部掌握 ✓</span>`:`<span class="sub">${done}/${cat.items.length} 已掌握</span>`}
    </div>
  </div>`;
}

function visibleItems(){
  let list = allItems();
  if(state.catId!=='all') list = list.filter(w=>w.category.id===state.catId);
  if(state.q){
    const q = state.q.trim().toLowerCase();
    if(q) list = list.filter(w => w.title.toLowerCase().includes(q) || (w.meta||'').toLowerCase().includes(q) || w.blocks.some(b=>b.text.toLowerCase().includes(q)) || w.category.name.includes(state.q.trim()));
  }
  return list;
}

function renderBrowse(){
  const list = visibleItems();
  if(!list.length){
    content.innerHTML = `<div class="empty"><div class="big">🔍</div><h3>没有找到相关内容</h3><p>换个关键词试试，或清除搜索。</p></div>`;
    return;
  }
  let html='';
  if(state.catId==='all' && !state.q){
    DATA.forEach(cat=>{
      const ws = list.filter(w=>w.category.id===cat.id);
      if(!ws.length) return;
      html += sectionHeader(cat) + `<div class="grid">${ws.map(cardHTML).join('')}</div>`;
    });
  } else if(state.catId==='all' && state.q){
    html += `<div class="section-head"><div><h3>搜索结果</h3><div class="sub">${list.length} 条匹配</div></div></div>`;
    html += `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  } else {
    const cat = DATA.find(c=>c.id===state.catId);
    html += sectionHeader(cat) + `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML = html;
  applyBlur();
}

function applyBlur(){
  document.querySelectorAll('.blk[data-bt]').forEach(p=>{
    const bt = p.dataset.bt;
    p.classList.toggle('blurred', state.blur==='all' || state.blur===bt);
  });
}

/* ================= 抽卡 ================= */
function flashList(){
  let l = allItems();
  if(state.flashFilter==='unmastered') l = l.filter(w=>!isMastered(w.id));
  else if(state.flashFilter==='favs') l = l.filter(w=>state.favs.has(w.id));
  return l;
}
function hintsHTML(it){
  let h = '';
  if(it.meta) h += `<div class="meta">${esc(it.meta)}</div>`;
  if(it.tags && it.tags.length) h += `<div class="tags">${it.tags.map(t=>`<span class="tagchip">${esc(t)}</span>`).join('')}</div>`;
  h += it.blocks.filter(b=>b.k==='note').map(blockHTML).join('');
  return h;
}
function answerHTML(it, revealed){
  const enb = it.blocks.filter(b=>b.k!=='note');
  const inner = enb.map(b=>`<div class="blk ${b.k==='ex'?'ex':'en'}"><span class="btag">${b.label}</span><p class="btext">${esc(b.text)}</p></div>`).join('');
  if(!inner) return '';
  return `<div class="quiz-answer ${revealed?'revealed':''}"><span class="blur-hint">🔒 先回忆，再点「显示答案」</span>${inner}</div>`;
}
function renderFlash(){
  const l = flashList();
  if(!l.length){
    content.innerHTML = `<div class="empty"><div class="big">🃏</div><h3>没有符合条件的卡片</h3><p>${state.flashFilter==='unmastered'?'太棒了，全部已掌握！可切换为「全部」继续复习。':'去收藏一些条目，或切换筛选条件。'}</p></div>`;
    return;
  }
  if(state.flashIndex>=l.length) state.flashIndex=0;
  const it = l[state.flashIndex];
  const cat = it.category;
  const titleCls = isEnWord(it.title) ? 'en' : '';
  content.innerHTML = `<div class="flash-wrap">
    <div class="flash-controls">
      <select class="select" id="flashFilter">
        <option value="all" ${state.flashFilter==='all'?'selected':''}>全部卡片</option>
        <option value="unmastered" ${state.flashFilter==='unmastered'?'selected':''}>未掌握</option>
        <option value="favs" ${state.flashFilter==='favs'?'selected':''}>已收藏</option>
      </select>
      <span class="pos">${state.flashIndex+1} / ${l.length}</span>
    </div>
    <div class="flash ${state.flashFlipped?'flipped':''}" id="flashCard">
      <div class="flash-inner">
        <div class="flash-face flash-front">
          <div class="flash-cat" style="--cat:${cat.color}">${cat.full}</div>
          <div class="flash-word ${titleCls}">${esc(it.title)}</div>
          ${hintsHTML(it)}
          <div class="flash-hint">点卡片翻面 · 回忆英文</div>
        </div>
        <div class="flash-face flash-back">
          <div class="flash-word ${titleCls}">${esc(it.title)}</div>
          ${it.blocks.filter(b=>b.k!=='note').map(blockHTML).join('')}
        </div>
      </div>
    </div>
    <div class="flash-actions">
      <button class="btn" data-fa="prev">← 上一张</button>
      <button class="btn primary" data-fa="flip">翻面</button>

      <button class="btn" data-fa="shuffle">🎲 随机</button>

function flashGo(dir){
  const l = flashList();
  if(!l.length) return;
  state.flashIndex = (state.flashIndex + dir + l.length) % l.length;
  state.flashFlipped = false;
  renderFlash();
}
function flashFlip(){ state.flashFlipped = !state.flashFlipped; const c=$('#flashCard'); if(c) c.classList.toggle('flipped', state.flashFlipped); }

/* ================= 默写 ================= */
function buildQuizDeck(){

}

  content.innerHTML = `<div class="quiz-wrap">

function quizNext(){

/* ================= 复习 ================= */
function buildReviewQueue(){
  const t = todayStr();
  const due = allItems().filter(w=>{ const s=getSrs(w.id); return s.lvl>=1 && s.due && s.due<=t; })
    .sort((a,b)=> (getSrs(a.id).due||'').localeCompare(getSrs(b.id).due||''));
  const fresh = shuffle(allItems().filter(w=>(state.srs[w.id]?.lvl??0)===0));
  state.reviewQueue = due.concat(fresh.slice(0, state.dailyNew));
  state.reviewIndex = 0; state.reviewRevealed = false; state.reviewStats = {ok:0,no:0};
}
function buildFreeQueue(){
  state.reviewQueue = shuffle(allItems());
  state.reviewIndex = 0; state.reviewRevealed = false; state.reviewStats = {ok:0,no:0};
}
function renderReview(){
  const t = todayStr();
  const dueNow = allItems().filter(w=>{ const s=getSrs(w.id); return s.lvl>=1 && s.due && s.due<=t; }).length;
  const fresh = allItems().filter(w=>(state.srs[w.id]?.lvl??0)===0).length;
  const mastered = masteredCount();
  const q = state.reviewQueue;
  const head = `<div class="review-head">
    <div class="stat-tile"><div class="n g">${mastered}/${TOTAL}</div><div class="l">已掌握</div></div>
    <div class="stat-tile"><div class="n r">${dueNow}</div><div class="l">今日到期</div></div>
    <div class="stat-tile"><div class="n a">${fresh}</div><div class="l">待学新词</div></div>
    <div class="stat-tile"><div class="n">${state.daily.done||0}</div><div class="l">今日已复习</div></div>
    <div class="head-ctrl">
      <label class="l" style="font-size:11px;color:var(--ink-3);letter-spacing:1px">每日新词</label>
      <select class="select" id="dailyNewSel">
        ${[0,3,5,8].map(n=>`<option value="${n}" ${state.dailyNew===n?'selected':''}>${n===0?'仅复习':n+' 条'}</option>`).join('')}
      </select>
    </div>
  </div>`;
  let body;
  if(q.length===0){
    body = `<div class="empty"><div class="big">🌿</div><h3>今日暂无复习任务</h3><p>已掌握 ${mastered}/${TOTAL}。${fresh>0?'可以增加「每日新词」开始学习，':''}或自由抽背全部。</p>
      <button class="btn primary" data-rv="again">开始复习</button>
      <button class="btn" data-rv="all">🎲 自由抽背全部</button></div>`;
  } else if(state.reviewIndex >= q.length){
    body = `<div class="empty"><div class="big">🎉</div><h3>本轮复习完成</h3><p>记得 ${state.reviewStats.ok} 条 · 忘了 ${state.reviewStats.no} 条 · 今日累计复习 ${state.daily.done} 条</p>
      <button class="btn primary" data-rv="again">再来一轮</button>
      <button class="btn" data-rv="all">🎲 自由抽背全部</button>
      <button class="btn" data-rv="browse">返回浏览</button></div>`;
  } else {
    const it = q[state.reviewIndex];
    const lvl = levelOf(it.id);
    const titleCls = isEnWord(it.title) ? 'en' : '';
    body = `<div class="quiz-card">
      <div class="quiz-top">
        <div>
          <div class="quiz-word ${titleCls}">${esc(it.title)}</div>
          <div class="quiz-cat">${it.category.full}</div>
        </div>
        <span class="lvl lvl${lvl}">${LEVELS[lvl]}</span>
      </div>
      <div class="quiz-prompt">第 ${state.reviewIndex+1} / ${q.length} · 回忆英文</div>
      ${hintsHTML(it)}
      ${answerHTML(it, state.reviewRevealed)}
      <div class="quiz-actions">
        ${!state.reviewRevealed?`<button class="btn primary" data-rv="reveal">显示答案</button>`
          :`<button class="btn ghost-green" data-rv="ok">✔ 记得</button><button class="btn" data-rv="no">✘ 忘了</button>`}
      </div>
    </div>
    <div class="quiz-stats"><span>本轮记得 <b>${state.reviewStats.ok}</b></span><span>本轮忘了 <b>${state.reviewStats.no}</b></span><span>今日已复习 <b>${state.daily.done}</b></span></div>`;
  }
  content.innerHTML = `<div class="review-wrap">${head}${body}</div>`;
}
function reviewNext(){ state.reviewIndex++; state.reviewRevealed = false; renderReview(); }

function exportBackup(){
  const data = {app:'英语二作文背诵卡', version:1, exportedAt:new Date().toISOString(), srs:state.srs, favs:[...state.favs], notes:state.notes};

function importBackup(data){
  if(!data || typeof data!=='object'){ toast('备份文件无效'); return; }
  if(data.srs && typeof data.srs==='object') state.srs = data.srs;
  if(Array.isArray(data.favs)) state.favs = new Set(data.favs);
  if(data.notes && typeof data.notes==='object') state.notes = data.notes;
  persistSrs(); persistFavs(); persistNotes();
  renderSidebar(); updateStats(); renderContent();
  toast('已导入备份 ✓');
}
function copyText(txt){
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
}

/* ================= 动作 ================= */
function toggleFav(id){
  if(state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
  persistFavs();
  const btn = document.querySelector(`[data-act="fav"][data-id="${id}"]`);
  if(btn) btn.classList.toggle('fav-on', state.favs.has(id));
  updateStats();
}
function toggleMaster(id){
  if(isMastered(id)){ state.srs[id] = {lvl:0, due:''}; }
  else { state.srs[id] = {lvl:4, due:addDays(30)}; }
  persistSrs();
  const card = document.getElementById('card-'+id);
  if(card){
    card.classList.toggle('mastered', isMastered(id));
    const lvlBadge = card.querySelector('.lvl');
    if(lvlBadge){ lvlBadge.className = 'lvl lvl'+levelOf(id); lvlBadge.textContent = LEVELS[levelOf(id)]; }
    const btn = card.querySelector('[data-act="master"]');
    if(btn){ btn.classList.toggle('master-on', isMastered(id)); btn.textContent = isMastered(id)?'✓':'○'; }
  }
  renderSidebar(); updateStats();
  toast(isMastered(id)?'已标记掌握 ✓':'已取消掌握');
}
function copyItem(id){
  const it = findItem(id); if(!it) return;
  const lines = [`【${it.title}】${it.meta||''}`, ...(it.tags||[]).map(t=>`· ${t}`), ...it.blocks.map(b=>`${b.label}：${b.text}`)];
  copyText(lines.join('\n'));
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}
function closeModal(id){ $('#'+id).classList.remove('show'); }

/* ================= 事件 ================= */
content.addEventListener('click', e=>{
  const reveal = e.target.closest('.reveal');
  const blk = e.target.closest('.blk');
  if(reveal || (blk && blk.classList.contains('blurred'))){
    if(blk){ blk.classList.remove('blurred'); return; }
  }
  const act = e.target.closest('[data-act]');
  if(act){
    const id = act.dataset.id, a = act.dataset.act;
    if(a==='fav') toggleFav(id);
    else if(a==='master') toggleMaster(id);
    else if(a==='copy') copyItem(id);
    return;
  }
  const fa = e.target.closest('[data-fa]');
  if(fa){
    const a = fa.dataset.fa;
    if(a==='flip') flashFlip();
    else if(a==='prev') flashGo(-1);
    else if(a==='next') flashGo(1);
    else if(a==='shuffle'){ const l=flashList(); if(l.length){ state.flashIndex=Math.floor(Math.random()*l.length); state.flashFlipped=false; renderFlash(); } }
    else if(a==='master'){ const l=flashList(); const w=l[state.flashIndex]; if(w) toggleMaster(w.id); }
    return;
  }
  const qa = e.target.closest('[data-qa]');
  if(qa){
    const a = qa.dataset.qa;
    const w = state.quizDeck[state.quizIndex];
    if(a==='reveal'){ state.quizRevealed=true; renderQuiz(); }
    else if(a==='know'){ state.session.reviewed++; state.session.mastered++; if(w && !isMastered(w.id)){ state.srs[w.id]={lvl:4,due:addDays(30)}; persistSrs(); renderSidebar(); updateStats(); } quizNext(); }
    else if(a==='again'){ state.session.reviewed++; quizNext(); }
    return;
  }
  const rv = e.target.closest('[data-rv]');
  if(rv){
    const a = rv.dataset.rv;
    if(a==='reveal'){ state.reviewRevealed=true; renderReview(); }
    else if(a==='ok'){ const w=state.reviewQueue[state.reviewIndex]; if(w) srsAnswer(w.id,true); state.reviewStats.ok++; renderSidebar(); updateStats(); reviewNext(); }
    else if(a==='no'){ const w=state.reviewQueue[state.reviewIndex]; if(w) srsAnswer(w.id,false); state.reviewStats.no++; renderSidebar(); updateStats(); reviewNext(); }
    else if(a==='again'){ buildReviewQueue(); renderReview(); }
    else if(a==='all'){ buildFreeQueue(); renderReview(); }
    else if(a==='browse'){ setView('browse'); }
    return;
  }
  const fcard = e.target.closest('#flashCard');
  if(fcard){ flashFlip(); return; }
});

content.addEventListener('input', e=>{
  if(e.target.classList.contains('para-note')){
    state.notes[e.target.dataset.note] = e.target.value;
    persistNotes();
  }
});
content.addEventListener('change', e=>{
  if(e.target.id==='flashFilter'){ state.flashFilter=e.target.value; state.flashIndex=0; state.flashFlipped=false; renderFlash(); }
  if(e.target.id==='quizFilter'){ state.quizFilter=e.target.value; buildQuizDeck(); renderQuiz(); }
  if(e.target.id==='dailyNewSel'){ state.dailyNew=parseInt(e.target.value,10); localStorage.setItem(LS+'_dailyNew', state.dailyNew); buildReviewQueue(); renderReview(); }
});

$('#nav').addEventListener('click', e=>{
  const catBtn = e.target.closest('[data-cat]');
  if(catBtn){ setCat(catBtn.dataset.cat); return; }
  const chip = e.target.closest('[data-chip]');
  if(chip){
    const w = findItem(chip.dataset.chip);
    if(w){ setCat(w.category.id); setTimeout(()=>{ const el=document.getElementById('card-'+chip.dataset.chip); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.boxShadow='0 0 0 3px var(--accent)'; setTimeout(()=>el.style.boxShadow='',1200);} },60); }
  }
});
function setCat(id){
  state.catId = id;
  if(state.view!=='browse') setView('browse');
  renderSidebar(); renderContent();
  closeSidebar();
}
function setView(v){
  state.view = v;
  $('#viewSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  const titles = {
    browse:['词库总览','图表作文模板 + 图表描述词汇 · 92 条'],
    review:['每日复习','间隔重复 · 今日任务'],
    flash:['抽卡复习','翻面回忆 · 空格翻面'],
    quiz:['挖空默写','遮住英文 · 先回忆再核对']
  };
  $('#viewTitle').textContent = titles[v][0];
  $('#viewSub').textContent = titles[v][1];
  if(v==='review') buildReviewQueue();
  if(v==='quiz') buildQuizDeck();
  if(v==='flash'){ state.flashIndex=0; state.flashFlipped=false; }
  renderContent();
}
$('#viewSeg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-view]');
  if(b) setView(b.dataset.view);
});
$('#blurSel').addEventListener('change', e=>{ state.blur=e.target.value; applyBlur(); });
$('#searchInput').addEventListener('input', e=>{ state.q=e.target.value; if(state.view!=='browse') setView('browse'); renderContent(); });
function toggleTheme(){
  state.theme = state.theme==='light'?'dark':'light';
  localStorage.setItem(LS+'_theme', state.theme); applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeIconSun').style.display = state.theme==='dark'?'none':'block';
  $('#themeIconMoon').style.display = state.theme==='dark'?'block':'none';
}
$('#themeBtn').addEventListener('click', toggleTheme);
$('#randomBtn').addEventListener('click', openRandom);
$('#shareBtn').addEventListener('click', ()=>{ renderShareCard(); $('#shareModal').classList.add('show'); });

document.addEventListener('click', e=>{
  const c = e.target.closest('[data-close]');
  if(c){ closeModal(c.dataset.close); return; }
  const r = e.target.closest('[data-rand]');
  if(r){
    const a = r.dataset.rand;
    if(a==='reveal'){ state.randomRevealed=true; renderRandomCard(); }
    else if(a==='reroll'){ pickRandom(); }
    else if(a==='ok'){ const w=findItem(state.randomId); if(w) srsAnswer(w.id,true); pickRandom(); }
    else if(a==='no'){ const w=findItem(state.randomId); if(w) srsAnswer(w.id,false); pickRandom(); }
    else if(a==='master'){ if(state.randomId) toggleMaster(state.randomId); renderRandomCard(); }
    else if(a==='copy'){ if(state.randomId) copyItem(state.randomId); }
    return;
  }
  const s = e.target.closest('[data-share]');
  if(s){
    const a = s.dataset.share;
    if(a==='copy') copyText('推荐一个考研英语二图表作文背诵卡 📝\n含图表作文模板（第一/二/三段）+ 图表描述词汇（上升/下降/占比/副词等），带背诵遮罩、抽卡、间隔复习，离线可用。\n把附件《英语二作文背诵卡.html》发给朋友，双击即可打开（手机电脑都行）。');
    else if(a==='export') exportBackup();
    else if(a==='import') $('#importFile').click();
    else if(a==='copy-url') copyText('把《英语二作文背诵卡.html》文件拖到 netlify.com/drop（免费、无需注册），几秒后即可得到一个网址链接发给朋友；也可以传到 GitHub Pages。');
    return;
  }
});
$('#importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ try{ importBackup(JSON.parse(reader.result)); }catch(err){ toast('文件解析失败'); } };
  reader.readAsText(file);
  e.target.value = '';
});
$('#btnReset').addEventListener('click', ()=>{
  if(confirm('确定清除所有掌握、收藏和笔记记录吗？')){
    state.srs = {}; state.favs.clear(); state.notes = {};
    state.daily = {date:todayStr(), done:0};
    persistSrs(); persistFavs(); persistNotes();
    localStorage.setItem(LS+'_daily', JSON.stringify(state.daily));
    renderSidebar(); updateStats(); renderContent();
    toast('已清除学习进度');
  }
});
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
$('#menuBtn').addEventListener('click', ()=>{ $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', closeSidebar);
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show')); }
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA') return;
  if(state.view==='flash'){
    if(e.code==='Space'){ e.preventDefault(); flashFlip(); }
    else if(e.code==='ArrowRight'){ flashGo(1); }
    else if(e.code==='ArrowLeft'){ flashGo(-1); }
  } else if(state.view==='quiz'){
    if(e.code==='Space'){ e.preventDefault(); if(!state.quizRevealed){ state.quizRevealed=true; renderQuiz(); } }
  } else if(state.view==='review'){
    if(e.code==='Space'){ e.preventDefault(); if(!state.reviewRevealed){ state.reviewRevealed=true; renderReview(); } }
  }
});

applyTheme();
renderSidebar();
updateStats();
renderContent();
</script>
</body>
</html>
